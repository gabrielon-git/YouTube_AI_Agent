name: Render AI Video
on: 
  workflow_dispatch:

jobs:
  build-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg imagemagick
          
      - name: Install Python Libraries
        run: |
          pip install moviepy==1.0.3 requests
          pip install imageio-ffmpeg
          
      - name: Run Video Renderer
        run: python render_video.py
        
      - name: Check if video exists
        run: ls -la

      - name: Upload Finished Video
        uses: actions/upload-artifact@v4
        with:
          name: Final-Video
          path: final_video.mp4
