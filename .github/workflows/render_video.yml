name: Autonomous Video Pipeline

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      topic:
        description: 'Video Topic (Leave blank for autonomous generation)'
        required: false
        default: ''
      format:
        description: 'Video Format'
        required: false
        default: 'short'
      voice:
        description: 'Edge-TTS Voice'
        required: false
        default: 'en-US-AriaNeural'

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Python Libraries
        run: |
          pip install --upgrade pip
          pip install moviepy edge-tts requests pillow google-genai

      - name: Run Video Renderer
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VIDEO_TOPIC: ${{ github.event.inputs.topic }}
          VIDEO_FORMAT: ${{ github.event.inputs.format }}
          VIDEO_VOICE: ${{ github.event.inputs.voice }}
        run: python render_video.py

      # --- SELF-HEALING SUPERVISOR STEP ---
      - name: Self-Heal on Failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python supervisor.py

      - name: Upload Finished Video
        uses: actions/upload-artifact@v4
        with:
          name: final-youtube-short
          path: final_video.mp4
