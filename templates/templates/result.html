<!DOCTYPE html>
<html>
<head>
    <title>Video Result</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: Arial; padding: 20px; text-align: center; background-color: #f0f2f5; }
        .container { background: white; padding: 20px; border-radius: 10px; display: inline-block; width: 90%; max-width: 600px; text-align: left; }
        video { width: 100%; border-radius: 5px; margin-top: 15px; }
        .btn { display: inline-block; margin-top: 15px; padding: 10px 20px; background: #28a745; color: white; text-decoration: none; border-radius: 5px; }
        pre { background: #f8f9fa; padding: 15px; border-radius: 5px; white-space: pre-wrap; word-wrap: break-word; font-family: monospace; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Your Video is Ready!</h2>
        <video controls>
            <source src="{{ video_url }}" type="video/mp4">
            Your browser does not support the video tag.
        </video>
        <br>
        <a href="{{ video_url }}" download class="btn">Download Video</a>
        
        <h3>Generated Script:</h3>
        <pre>{{ script }}</pre>
    </div>
</body>
</html>
